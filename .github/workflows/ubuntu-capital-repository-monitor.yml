name: Ubuntu Capital OS Repository Monitor

on:
  schedule:
    - cron: '0 0 * * *'
      timezone: 'Africa/Johannesburg'
    - cron: '0 12 * * *'
      timezone: 'Africa/Johannesburg'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write

concurrency:
  group: ubuntu-capital-repository-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Inspect repository changes and produce report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Checkout repository default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate repository change report
        id: monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          python scripts/monitoring/repository_monitor_v5.py

      - name: Publish report to job summary
        if: always()
        run: |
          if [ -f monitoring-output/report.md ]; then
            cat monitoring-output/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Repository monitor did not produce a report." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload monitoring report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-capital-repository-monitor-${{ github.run_id }}
          path: monitoring-output/
          if-no-files-found: warn
          retention-days: 7

      - name: Determine whether the report should be published
        id: reportability
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.monitor.outputs.reportable }}" = "true" ] || grep -q '\*\*History integrity event:\*\* YES' monitoring-output/report.md 2>/dev/null; then
            echo "reportable=true" >> "$GITHUB_OUTPUT"
          else
            echo "reportable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub issue for material changes
        if: steps.reportability.outputs.reportable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_TITLE: ${{ steps.monitor.outputs.report_title }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "$REPORT_TITLE" \
            --body-file monitoring-output/report.md
